{% extends "layout.html" %}
{% block content %}
<div class="row">
  <div class="col-md-6 offset-md-3 card fb-card card-body">
    <h1 class="h2 mb-3">Edit profile</h1>
    <form method="POST" action="{{ url_for('views.edit') }}">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <div class="form-group">
        <label for="name">Full Name:</label>
        <input id="name" class="form-control" type="text" name="name"
               value="{{ request.form.get('name', g.user['name']) }}" required>
      </div>
      <div class="form-group">
        <label for="email">Email:</label>
        <input id="email" class="form-control" type="email" name="email"
               value="{{ request.form.get('email', g.user['email']) }}" required>
      </div>
      <div class="form-group">
        <label for="about">About Me:</label>
        <textarea id="about" class="form-control" name="about" required>{{ request.form.get('about', g.user['about']) }}</textarea>
      </div>
      <button class="btn btn-primary" type="submit">Save</button>
    </form>
  </div>
</div>
{% endblock %}
