{% extends "layout.html" %}
{% block title %}{{ posts[0]['author'] }} - {{ site.name }}{% endblock %}
{% block content %}
<div class="row">
  <div class="col-lg-6 offset-lg-3 col-md-8 offset-md-2">
    {% for p in posts %}{% include "_post.html" %}{% endfor %}
    <a class="btn btn-ghost btn-block mb-3" href="{{ url_for('feed.gigs') }}">&larr; Back to the gig board</a>
  </div>
</div>
{% endblock %}
