{# round avatar with the user's initial; the colour comes from the user id (6 colours in style.css) #}
{% macro avatar(username, user_id, size='') -%}
<span class="avatar av{{ user_id % 6 }} {{ size }}" aria-hidden="true">{{ username[0]|upper }}</span>
{%- endmacro %}
